name: CI

# Runs on every pull request and on every push to main.
# Deployment is NOT done here: Vercel's GitHub integration builds a Preview per PR and Production on merge to main.
# To make "tests must pass before merging" enforceable, require the "Checks" job in the branch protection rules.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholders only: the build needs the variables to exist, but never talks to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # LayoutProps / PageProps are generated by Next into .next/types. A fresh checkout has no .next,
      # so generate them first or the type-check fails with "Cannot find name 'LayoutProps'".
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Advisory for now: the project still has lint errors in several pages (see the PR notes).
      # Remove "continue-on-error" once they are fixed to make lint a required check.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
